<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FELIZ DÍA PROFE NICO</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        *, *::before, *::after {
            border-radius: 0px !important;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100dvh;
            overflow: hidden;
            background-color: #000000;
            font-family: monospace, system-ui, -apple-system, sans-serif;
        }
    </style>
</head>
<body class="bg-black text-white w-screen h-[100dvh] relative overflow-hidden flex items-center justify-center cursor-pointer select-none">

    <!-- Indicador dinámico de carga -->
    <div id="startPrompt" class="z-10 px-8 py-5 border border-zinc-800 bg-black text-center pointer-events-none transition-opacity duration-300">
        <p id="promptText" class="text-xs tracking-[0.25em] font-mono text-zinc-400 uppercase">CARGANDO VÍDEO (0%)</p>
    </div>

    <!-- Elemento de video adaptado a 16:9 horizontal con object-contain y bg-black -->
    <video 
        id="loopVideo" 
        class="absolute inset-0 w-full h-full object-contain bg-black opacity-0 transition-opacity duration-300 pointer-events-none"
        playsinline
        webkit-playsinline
        loop
        muted
        preload="auto"
        src="./index.mp4">
    </video>

    <script>
        const video = document.getElementById('loopVideo');
        const startPrompt = document.getElementById('startPrompt');
        const promptText = document.getElementById('promptText');
        
        let isReadyToPlay = false;

        // Forzar la carga en algunos navegadores móviles
        video.load();

        // Monitorear el progreso de descarga real del vídeo
        video.addEventListener('progress', function() {
            if (video.buffered.length > 0 && video.duration > 0) {
                const bufferedEnd = video.buffered.end(video.buffered.length - 1);
                const duration = video.duration;
                const percent = Math.min(100, Math.round((bufferedEnd / duration) * 100));
                
                if (!isReadyToPlay) {
                    promptText.textContent = `CARGANDO VÍDEO (${percent}%)`;
                }
            }
        });

        // Función para habilitar el inicio de reproducción de forma segura
        function makeReady() {
            if (isReadyToPlay) return;
            isReadyToPlay = true;
            promptText.textContent = "TOCA LA PANTALLA";
            startPrompt.classList.remove('text-zinc-400');
            startPrompt.classList.add('text-zinc-100', 'border-zinc-500');
        }

        // Múltiples eventos de respaldo para evitar que se quede trabado
        video.addEventListener('loadeddata', makeReady);
        video.addEventListener('canplay', makeReady);
        video.addEventListener('canplaythrough', makeReady);

        // Seguridad adicional: si transcurren 2 segundos y el vídeo ya tiene datos, habilitarlo por fuerza
        setTimeout(() => {
            if (!isReadyToPlay && video.readyState >= 2) {
                makeReady();
            }
        }, 2000);

        // Manejo de errores si no se encuentra el archivo index.mp4
        video.addEventListener('error', function() {
            promptText.textContent = "ERROR: NO SE ENCUENTRA EL VÍDEO";
            promptText.classList.add('text-red-500');
            console.error("Error al cargar el archivo de video. Asegúrate de que index.mp4 esté en la misma carpeta.");
        });

        function startPlayback() {
            video.muted = false;

            const playPromise = video.play();

            if (playPromise !== undefined) {
                playPromise.then(() => {
                    if (startPrompt) startPrompt.remove();
                    video.classList.remove('opacity-0');
                    document.body.style.pointerEvents = 'none';
                    cleanupListeners();
                }).catch(function(error) {
                    console.warn("Fallback de audio activado:", error);
                    video.muted = true;
                    video.play().then(() => {
                        video.muted = false;
                        if (startPrompt) startPrompt.remove();
                        video.classList.remove('opacity-0');
                        document.body.style.pointerEvents = 'none';
                        cleanupListeners();
                    }).catch(err => {
                        console.error("No se pudo reproducir automáticamente:", err);
                    });
                });
            }
        }

        function cleanupListeners() {
            window.removeEventListener('click', startPlayback);
            window.removeEventListener('touchstart', startPlayback);
        }

        window.addEventListener('click', startPlayback);
        window.addEventListener('touchstart', startPlayback, { passive: true });
    </script>
</body>
</html>
