<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FELIZ DÍA PROFE NICO</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        *, *::before, *::after {
            border-radius: 0px !important;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100dvh;
            overflow: hidden;
            background-color: #000000;
            font-family: monospace, system-ui, -apple-system, sans-serif;
        }
    </style>
</head>
<body class="bg-black text-white w-screen h-[100dvh] relative overflow-hidden flex items-center justify-center cursor-pointer select-none">

    <!-- Indicador dinámico -->
    <div id="startPrompt" class="z-10 px-8 py-5 border border-zinc-800 bg-black text-center pointer-events-none transition-opacity duration-300">
        <p id="promptText" class="text-xs tracking-[0.25em] font-mono text-zinc-100 uppercase border-zinc-500">TOCA LA PANTALLA</p>
    </div>

    <!-- Elemento de video con soporte múltiple (MP4 prioritario para iOS/Safari) -->
    <video 
        id="loopVideo" 
        class="absolute inset-0 w-full h-full object-contain bg-black opacity-0 transition-opacity duration-300 pointer-events-none"
        playsinline
        webkit-playsinline
        loop
        muted
        preload="auto">
        <source src="./index.mp4" type="video/mp4">
        <source src="./index.webm" type="video/webm">
        Tu navegador no soporta la reproducción de video.
    </video>

    <script>
        const video = document.getElementById('loopVideo');
        const startPrompt = document.getElementById('startPrompt');
        const promptText = document.getElementById('promptText');
        
        let isReadyToPlay = false;

        // Forzar carga inicial en móviles
        video.load();

        function makeReady() {
            if (isReadyToPlay) return;
            isReadyToPlay = true;
        }

        // En móviles aseguramos disponibilidad rápida sin depender de eventos complejos de buffer
        video.addEventListener('loadedmetadata', makeReady);
        video.addEventListener('canplay', makeReady);
        setTimeout(makeReady, 500);

        video.addEventListener('error', function() {
            promptText.textContent = "ERROR: NO SE ENCUENTRA EL VÍDEO";
            promptText.classList.add('text-red-500');
            console.error("Error al cargar el archivo de video. Asegúrate de que index.mp4 esté en la misma carpeta.");
        });

        function startPlayback() {
            // Reproducir primero (la interacción del usuario desbloquea el reproductor)
            const playPromise = video.play();

            if (playPromise !== undefined) {
                playPromise.then(() => {
                    // Intentar activar el audio de forma segura tras iniciar
                    video.muted = false;
                    if (startPrompt) startPrompt.remove();
                    video.classList.remove('opacity-0');
                    cleanupListeners();
                }).catch(function(error) {
                    console.warn("Fallback de audio activado:", error);
                    video.muted = true;
                    video.play().then(() => {
                        if (startPrompt) startPrompt.remove();
                        video.classList.remove('opacity-0');
                        cleanupListeners();
                    });
                });
            }
        }

        function cleanupListeners() {
            window.removeEventListener('click', startPlayback);
            window.removeEventListener('touchstart', startPlayback);
        }

        window.addEventListener('click', startPlayback);
        window.addEventListener('touchstart', startPlayback, { passive: true });
    </script>
</body>
</html>
